name: Rust CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.89.0", stable, beta, nightly]
    steps:
    - uses: actions/checkout@v6

    - uses: dtolnay/rust-toolchain@nightly
      if: ${{ matrix.rust == '1.89.0' }}
    - name: Generate Cargo.lock with minimal-version dependencies
      if: ${{ matrix.rust == '1.89.0' }}
      run: cargo -Zminimal-versions generate-lockfile

    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
    - name: Cache Cargo Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: build
      if: ${{ matrix.rust != '1.89.0' }}
      run: cargo build -v
    - name: Build all targets with minimum dependencies
      if: ${{ matrix.rust == '1.89.0' }}
      run: cargo build -v --all-features --all-targets
    - name: Test pure Rust Zstd decoding with minimum dependencies
      if: ${{ matrix.rust == '1.89.0' }}
      run: cargo test --no-default-features --features zstd-safe-rust --lib decoder::image::zstd_tests
    - name: test
      if: ${{ matrix.rust != '1.89.0' }}
      run: cargo test -v && cargo doc -v --all-features --no-deps

  test-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Cache Cargo Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: test
      run: cargo test -v
    - name: Test native Zstd encoding and decoding
      if: ${{ runner.os == 'Windows' || runner.os == 'macOS' }}
      run: cargo test --features zstd,zstd-safe-rust --lib --test encode_images_with_compression

  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: ["", deflate, fax, jpeg, lzw, webp, zstd, zstd-safe-rust, default, "default,zstd"]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Cargo clippy
      run: cargo clippy --lib --no-default-features --features "${{ matrix.feature }}" -- -D warnings

    - name: Test native Zstd encoding and decoding
      if: ${{ matrix.feature == 'zstd' || matrix.feature == 'default,zstd' }}
      run: cargo test --no-default-features --features "${{ matrix.feature }},zstd-safe-rust" --lib --test encode_images_with_compression

    - name: Test pure Rust Zstd decoding
      if: ${{ matrix.feature == 'zstd-safe-rust' }}
      run: cargo test --no-default-features --features zstd-safe-rust --lib decoder::image::zstd_tests

    - name: Test WebP decoding
      if: ${{ matrix.feature == 'webp' }}
      run: cargo test --no-default-features --features webp --test decode_geotiff_images test_webp_tiff

  other_archs:
    # github actions does not support 32-bit or big endian systems directly, but
    # it does support QEMU. so we install qemu, then build and run the tests on
    # emulated systems. NOTE: you can also use this approach to test locally.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [powerpc-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cross
      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.arch }}
      - name: Cross-Run Tests using QEMU
        run: cross test --target ${{ matrix.arch }}

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@cargo-hack
    - name: Check MSRV
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      run: cargo hack check --rust-version --each-feature --lib

  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Run rustfmt check
      run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - run: cargo clippy --all-features --all-targets -- -D warnings
